<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <meta name="description" content="Aggiungi l'orario delle lezioni UNIMORE al tuo calendario (Google, Apple, Outlook), filtrando solo i corsi che segui.">
  <title>UNIMORE Calendar</title>

  <!-- Bootstrap -->
  <link href="/css/bootstrap.css" rel="stylesheet">
  <link href="/css/template.css" rel="stylesheet">
  <link rel="shortcut icon" href="/calendar.png" type="image/x-icon" />

  <!-- Custom styles -->
  <link href="/css/home.css" rel="stylesheet">
  <script src="/scripts/catalog.js" defer></script>
  <script src="/scripts/home.js" defer></script>
</head>

<body class="">
  <div class="container" id="main-container">
  <div class="mt-5">
    <h1><a href="/"><img src="/calendar.png" alt="UNIMORE Calendar" style="width: 40px; height: 40px; margin-right: 10px; margin-top: 3px; vertical-align: top;">UNIMORE Calendar</a></h1>
    <h6>Vuoi inserire i tuoi appuntamenti universitari nel tuo calendario (iCloud, Google, ecc)?<br>Riempi i campi qui sotto per cominciare</h6>
  </div>
  <div class="mt-3" id="box">
    <form id="form_calendar" class="form-group" action="/corso" method="get">
      <div class="mb-3">
        <select id="areas" class="form-select" name="s" aria-label="Scuola">
          <option value="">--- Seleziona Scuola ---</option>
        </select>
      </div>
      <div id="courses-container" class="mb-3">
        <select id="courses" class="form-select" name="c" aria-label="Corso">
        </select>
        <div class="spinner-border loading-image-invisible" id="courses-loading" role="status"></div>
      </div>
      <div class="mb-3">
        <select id="years" class="form-select" name="y" aria-label="Anno">
        </select>
      </div>
      <div id="curricula-container" class="mb-3">
        <select id="curricula" class="form-select" name="a" aria-label="Curriculum">
        </select>
        <div class="spinner-border loading-image-invisible" id="curricula-loading" role="status"></div>
      </div>
      <div>
        <input type="submit" id="submit-form-button" class="btn btn-primary d-inline" value="Avanti" disabled>
      </div>
      <div id="low-connection">Connessione debole...</div>
      <div id="not-available" class="mt-2">Siamo spiacenti, ma UNIMORE non ha reso disponibile l'orario per questo percorso sul portale pubblico.</div>
    </form>
    <p class="text-muted small mt-2 mb-0" id="aa-label"></p>
  </div>
</div>
  <!-- FOOTER -->
  <figure class="text-center mt-5 px-3">
    <figcaption class="blockquote-footer">
      Sito indipendente, <strong>non affiliato né approvato dall&#39;Università degli Studi di Modena e Reggio Emilia (UNIMORE)</strong>.<br>
      Gli orari provengono dal portale pubblico <a href="https://www.aule.unimore.it/PortaleStudentiUnimore/" target="_blank" rel="noopener">aule.unimore.it</a>: in caso di dubbi fa fede il sito ufficiale.<br>
      Basato su <a href="https://github.com/FrancescoBonzi/UniboCalendar" target="_blank" rel="noopener">UniboCalendar</a> · Licenza AGPL-3.0 · <a href="https://github.com/" id="source-link" target="_blank" rel="noopener">Codice sorgente</a>
    </figcaption>
  </figure>
</body>

</html>
